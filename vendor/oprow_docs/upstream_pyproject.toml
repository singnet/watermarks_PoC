[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oprow-step14"
version = "0.14.0"
description = "OProW Step 14 draft: transform/adversarial benchmark harness layered on the reference SDK."
readme = "README_STEP14.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=41",
  "numpy>=1.23",
  "Pillow>=10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["oprow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
