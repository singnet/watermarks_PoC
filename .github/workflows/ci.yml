name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout openwater-mk
        uses: actions/checkout@v4
        with:
          path: openwater-mk

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install demo deps (oprow vendored in-tree)
        working-directory: openwater-mk
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e '.[web,test]'

      - name: Run upstream oprow test suite (vendored, smoke)
        working-directory: openwater-mk
        run: python -m pytest tests/oprow_upstream/ -q

      - name: Run demo test suite
        working-directory: openwater-mk
        run: python -m pytest tests/ --ignore=tests/oprow_upstream -v

      - name: Lint shell scripts
        run: |
          sudo apt-get update -y -qq && sudo apt-get install -y -qq shellcheck
          shellcheck openwater-mk/scripts/*.sh
