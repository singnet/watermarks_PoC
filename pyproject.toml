[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openwater-mk"
version = "0.1.0"
description = "openwater-mk: minimal orchestration + CLI for the OpenWater provenance stack (built on oprow Version 0)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [
  { name = "Alejandro Corona", email = "alexander.krone@singularitynet.io" },
]
dependencies = [
  # oprow Version 0 SDK is vendored in-tree under ./oprow/.
  # Source: oprow_step14_benchmarks-20260512T133940Z (see vendor/oprow_docs/VENDORING.md).
  "cryptography>=41",
  "numpy>=1.23",
  "Pillow>=10",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.110,<0.137",
  "starlette>=0.37,<1.1",
  "uvicorn>=0.27,<0.47",
  "python-multipart>=0.0.9,<0.0.29",
]
test = [
  "httpx>=0.27,<0.29",
  "pytest>=8,<10",
]

[project.scripts]
openwater = "openwater_mk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openwater_mk*", "oprow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
